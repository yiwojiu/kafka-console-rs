# 可选的配置文件。集群连接平时在页面右上角「集群管理」里维护，
# 保存到 config/clusters.json；本文件只用于两件事：
#   1. 设置 [server]（监听地址、请求超时）
#   2. clusters.json 还不存在时，用下面的 [[clusters]] 做一次「首次导入」
#
# 用法：复制为 config/clusters.toml 再改。想彻底不依赖配置文件，
# 连这个文件都不用创建，监听地址可用环境变量 KAFKA_CONSOLE_LISTEN 覆盖。

[server]
listen = "0.0.0.0:7755"
request_timeout_secs = 15

[[clusters]]
name = "local"
bootstrap_servers = "127.0.0.1:9092"
security_protocol = "PLAINTEXT"

