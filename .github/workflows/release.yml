name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          # Linux 用 musl 静态链接：产出的二进制不依赖目标机的 glibc 版本，
          # 老系统（CentOS 7 / 麒麟 V10 之类）也能直接跑。
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # OpenSSL（ssl-vendored）与 librdkafka（cmake-build）都要就地编译，
      # Windows 下必须先让 nmake / link.exe 进入 PATH 与 INCLUDE/LIB。
      - name: Setup MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl pkg-config musl-tools
          musl-gcc --version | head -1

      # musl 目标必须让 cc / cmake 都用 musl-gcc，否则 librdkafka 和 OpenSSL
      # 会被按 glibc 编译，最后链接时报一堆 undefined reference。
      - name: Point toolchain at musl
        if: runner.os == 'Linux'
        run: |
          set -eu
          t="${{ matrix.target }}"
          u="${t//-/_}"
          echo "CC_${u}=musl-gcc" >> "$GITHUB_ENV"
          echo "AR_${u}=ar" >> "$GITHUB_ENV"
          echo "RANLIB_${u}=ranlib" >> "$GITHUB_ENV"
          upper=$(printf '%s' "$u" | tr 'a-z' 'A-Z')
          echo "CARGO_TARGET_${upper}_LINKER=musl-gcc" >> "$GITHUB_ENV"
          if command -v musl-g++ > /dev/null; then
            echo "CXX_${u}=musl-g++" >> "$GITHUB_ENV"
          fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --locked --target ${{ matrix.target }} 2>&1 | tee build.log
          # 失败时把关键输出写进 Job Summary，方便在网页上直接看到原因
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            {
              echo "### build ${{ matrix.name }} failed"
              echo '```'
              grep -v '^\s*Compiling ' build.log | tail -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "kafka-console-rs-${{ matrix.name }}"
          $root = "out/$pkg"
          New-Item -ItemType Directory -Force -Path "$root/config" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/kafka-console-rs.exe" "$root/"
          Copy-Item -Recurse "static" "$root/static"
          Copy-Item "config/clusters.example.toml" "$root/config/"
          Copy-Item "README.md" "$root/"
          Compress-Archive -Path "$root/*" -DestinationPath "out/$pkg.zip" -Force

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          pkg="kafka-console-rs-${{ matrix.name }}"
          root="out/$pkg"
          mkdir -p "$root/config"
          cp "target/${{ matrix.target }}/release/kafka-console-rs" "$root/"
          cp -r static "$root/static"
          cp config/clusters.example.toml "$root/config/"
          cp README.md "$root/"
          tar -czf "out/$pkg.tar.gz" -C out "$pkg"

      - name: Checksum
        shell: bash
        run: |
          cd out
          if command -v sha256sum > /dev/null; then
            sha256sum "kafka-console-rs-${{ matrix.name }}.${{ matrix.archive }}" > SHA256SUMS.txt
          else
            shasum -a 256 "kafka-console-rs-${{ matrix.name }}.${{ matrix.archive }}" > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            out/*.${{ matrix.archive }}
            out/SHA256SUMS.txt

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          find artifacts -name 'SHA256SUMS.txt' -exec cat {} + | sort -u > dist/SHA256SUMS.txt
          ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            Rust 实现的 Kafka 控制台，单二进制 Web 服务，无 JVM 依赖。

            **包含**：概览 / Topic 管理 / 消费组积压 / 消息浏览（SSE 流式、持续监听）/ 在线发消息 /
            页面端集群管理 / 积压位点重置。支持 PLAINTEXT、SSL、SASL_PLAINTEXT、SASL_SSL（OpenSSL 已静态链接）。

            **下载后**：解压 → 进入目录 → 运行 `kafka-console-rs`（Windows 为 `.exe`）→ 浏览器打开
            `http://127.0.0.1:7755` → 右上角「集群管理」填 Kafka 地址。

            | 平台 | 包 |
            |---|---|
            | Windows x64 | `kafka-console-rs-windows-x64.zip` |
            | Linux x64（musl 静态） | `kafka-console-rs-linux-x64.tar.gz` |
            | Linux arm64（musl 静态） | `kafka-console-rs-linux-arm64.tar.gz` |

            Linux 版为 musl 静态链接，不依赖目标机 glibc 版本（CentOS 7 / 麒麟 V10 等老系统可直接运行）。

            校验：`sha256sum -c SHA256SUMS.txt`（macOS 用 `shasum -a 256 -c`）。
