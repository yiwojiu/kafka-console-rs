[package]
name = "kafka-console-rs"
version = "0.1.1"
edition = "2021"
rust-version = "1.74"

[dependencies]
rdkafka = { version = "0.40", features = ["cmake-build", "zstd", "tracing", "ssl-vendored"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
